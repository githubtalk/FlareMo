# 自托管 fork 的生产部署。
#
# - workflow_dispatch：手动发布，可选 dry_run / provision。
# - push 到 main：自动发布（升级 PR 合并后自动上线）。
# - schedule：每天检查上游最新稳定 Release，有新版则自动升级并发布。
#
# 上游仓库 realchendahuang/FlareMo 不会跑这个 job。
# 真正执行的仍是仓库里的 `pnpm deploy`：构建前端、远端 D1 migration、再 wrangler deploy。
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, wrangler dry-run, and read-only resource check; skip D1 migration, publish, and secret sync"
        required: false
        type: boolean
        default: false
      provision:
        description: "Create missing D1, R2, Queue, and Vectorize resources"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
  schedule:
    # 每天 04:23 UTC 检查上游最新稳定 Release
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: flaremo-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'realchendahuang/FlareMo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write wrangler.jsonc
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
          FLAREMO_D1_DATABASE_ID: ${{ secrets.FLAREMO_D1_DATABASE_ID }}
          FLAREMO_PUBLIC_URL: ${{ vars.FLAREMO_PUBLIC_URL || secrets.FLAREMO_PUBLIC_URL }}
          FLAREMO_DEPLOY_REPOSITORY: ${{ vars.FLAREMO_DEPLOY_REPOSITORY }}
        run: node ./scripts/write-wrangler-config.mjs

      - name: Provision / verify Cloudflare resources
        run: |
          set -euo pipefail
          if [[ "${{ inputs.provision }}" == "true" && "${{ inputs.dry_run }}" != "true" ]]; then
            pnpm provision:remote
          else
            pnpm provision:remote -- --check
          fi

      - name: Deploy
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            pnpm deploy:dry-run
          else
            pnpm deploy
          fi

      - name: Sync Worker secrets
        if: ${{ inputs.dry_run != true }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          FLAREMO_BOOTSTRAP_SECRET: ${{ secrets.FLAREMO_BOOTSTRAP_SECRET }}
        run: pnpm secrets:sync

      - name: Smoke check deployed site
        if: ${{ inputs.dry_run != true }}
        run: pnpm smoke:check
